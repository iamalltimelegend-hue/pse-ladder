<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSE Ladder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2185b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PSE Ladder">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:linear-gradient(135deg,#fce4ec 0%,#fdf0f8 45%,#f3e8ff 100%);
  background-attachment:fixed;
  color:#2d1523;
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;
  display:flex;flex-direction:column;
}

/* ── PW SCREEN ── */
#pw-screen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#fce4ec 0%,#fdf0f8 45%,#f3e8ff 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
.pw-logo{font-size:42px;font-weight:900;color:#c2185b;letter-spacing:3px;}
.pw-sub{font-size:15px;color:#9a6878;}
#pw-box{display:flex;flex-direction:column;align-items:center;gap:12px;width:300px;}
#pw-input{
  width:100%;padding:14px 18px;border-radius:10px;border:1.5px solid rgba(194,24,91,0.3);
  background:rgba(255,248,252,0.9);font-size:18px;text-align:center;font-family:inherit;
  color:#2d1523;letter-spacing:4px;outline:none;
}
#pw-input:focus{border-color:#c2185b;}
#pw-submit{
  width:100%;padding:14px;background:linear-gradient(135deg,#f06292,#ba68c8);
  color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;
  cursor:pointer;font-family:inherit;letter-spacing:1px;
}
#pw-error{color:#e53935;font-size:14px;min-height:20px;}

/* ── NAV ── */
#nav{
  background:rgba(255,235,245,0.97);
  border-bottom:1px solid rgba(212,84,138,0.18);
  padding:0 16px;display:flex;align-items:center;
  height:60px;flex-shrink:0;gap:0;position:sticky;top:0;z-index:100;
}
.logo{font-weight:900;font-size:22px;color:#c2185b;letter-spacing:1px;margin-right:20px;white-space:nowrap;}
.nav-btn{
  background:none;border:none;color:#9a6878;font-size:14px;
  padding:0 16px;height:60px;cursor:pointer;font-family:inherit;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;white-space:nowrap;
  flex-shrink:0;
}
.nav-btn:hover{color:#4a2a3a;}
.nav-btn.active{color:#c2185b;border-bottom-color:#c2185b;}
#timer-wrap{margin-left:auto;font-size:13px;color:#9a6878;white-space:nowrap;}
#timer-wrap span{color:#2d1523;font-weight:700;font-variant-numeric:tabular-nums;}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px;}
.view{width:100%;max-width:820px;display:none;}
.view.active{display:block;}

/* ── FILTERS ── */
.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.filter-btn{
  padding:6px 14px;border-radius:20px;border:1.5px solid rgba(194,24,91,0.22);
  background:none;color:#9a6878;font-size:13px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:all .15s;
}
.filter-btn:hover{background:rgba(194,24,91,0.07);color:#c2185b;}
.filter-btn.active{background:linear-gradient(135deg,#f06292,#ba68c8);color:#fff;border-color:transparent;}
.filter-sep{width:1px;height:20px;background:rgba(194,24,91,0.15);flex-shrink:0;}
.filter-select{
  background:#fce8f5;border:1px solid rgba(212,84,138,0.2);
  color:#4a2a3a;padding:6px 12px;border-radius:6px;
  font-family:inherit;font-size:13px;cursor:pointer;
}

/* ── PROGRESS BAR ── */
.progress-row{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.progress-bar{flex:1;height:6px;background:rgba(194,24,91,0.1);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#f06292,#ba68c8);border-radius:3px;transition:width .3s;}
.progress-text{font-size:13px;color:#9a6878;white-space:nowrap;}

/* ── FLASHCARD ── */
.card-wrap{perspective:1000px;height:300px;margin-bottom:24px;cursor:pointer;}
.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s;}
.card.flipped{transform:rotateY(180deg);}
.card-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  background:rgba(255,248,252,0.9);border:1px solid rgba(212,84,138,0.18);
  border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:28px 36px;text-align:center;gap:12px;
}
.card-back{transform:rotateY(180deg);}
.card-face .lbl{font-size:11px;letter-spacing:2px;color:#b07888;text-transform:uppercase;}
.card-face .ko{font-size:26px;font-weight:600;line-height:1.5;color:#2d1523;word-break:keep-all;}
.card-face .en{font-size:22px;font-weight:600;color:#8b5cf6;line-height:1.6;word-break:break-word;}
.card-face .day-tag{font-size:11px;color:#b07888;margin-top:6px;}
.card-hint{font-size:12px;color:#9a6878;text-align:center;margin-bottom:12px;}
.card-hint b{color:#4a9eff;}

/* ── CARD ACTIONS ── */
.card-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.btn{
  padding:13px 36px;border-radius:8px;font-size:15px;font-weight:700;
  cursor:pointer;font-family:inherit;transition:all .15s;border:1px solid;
}
.btn-know{background:#e8f5ee;color:#2e7d52;border-color:rgba(60,160,100,0.3);}
.btn-know:hover{background:#c8eada;}
.btn-dontknow{background:#fde0e0;color:#c0392b;border-color:rgba(220,80,80,0.3);}
.btn-dontknow:hover{background:#f9c0c0;}
.btn-skip{background:rgba(194,24,91,0.06);color:#9a6878;border-color:rgba(194,24,91,0.15);}
.btn-skip:hover{background:rgba(194,24,91,0.12);}
.btn-primary{background:linear-gradient(135deg,#f06292,#ba68c8);color:#fff;border-color:transparent;}
.btn-primary:hover{opacity:.9;}

/* ── MODE SELECTOR ── */
.mode-select-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.mode-btn{
  padding:7px 16px;border-radius:20px;border:1.5px solid rgba(194,24,91,0.22);
  background:none;color:#9a6878;font-size:13px;cursor:pointer;font-family:inherit;
}
.mode-btn.active{background:rgba(194,24,91,0.1);color:#c2185b;border-color:#c2185b;}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:60px 20px;color:#b07888;font-size:16px;}
.empty-state b{color:#c2185b;}

/* ── SRS DONE ── */
.done-card{
  background:rgba(255,248,252,0.9);border:1px solid rgba(212,84,138,0.18);
  border-radius:14px;padding:48px 28px;text-align:center;
}
.done-card h2{font-size:28px;font-weight:800;color:#c2185b;margin-bottom:12px;}
.done-card p{color:#9a6878;font-size:15px;margin-bottom:24px;}

/* ── DIALOGUE VIEW ── */
.dial-card{
  background:rgba(255,248,252,0.9);border:1px solid rgba(212,84,138,0.18);
  border-radius:14px;padding:24px 28px;margin-bottom:20px;
}
.dial-line{
  display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(212,84,138,0.08);
  align-items:flex-start;
}
.dial-line:last-child{border-bottom:none;}
.dial-spk{
  font-size:13px;font-weight:700;color:#c2185b;min-width:24px;
  background:rgba(194,24,91,0.1);border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
}
.dial-content{flex:1;}
.dial-ko{font-size:17px;font-weight:600;color:#2d1523;line-height:1.5;word-break:keep-all;}
.dial-en{font-size:15px;color:#8b5cf6;line-height:1.5;margin-top:4px;word-break:break-word;}
.dial-en.context{color:#9a7090;font-style:italic;}
.dial-en.hidden{
  background:rgba(194,24,91,0.1);color:transparent;border-radius:4px;
  cursor:pointer;user-select:none;min-height:22px;
  display:inline-block;min-width:120px;
}
.dial-en.hidden::before{content:'▶ 클릭하여 확인';}
.dial-en.hidden:hover{background:rgba(194,24,91,0.15);}
.dial-en.revealed{color:#8b5cf6;background:none;}
.dial-nav{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:16px;}
.dial-nav-info{font-size:13px;color:#9a6878;}
.dial-reveal-btn{
  padding:10px 24px;background:linear-gradient(135deg,#f06292,#ba68c8);
  color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
}

/* ── EXPRESSION VIEW ── */
.expr-card-wrap{perspective:1000px;height:240px;margin-bottom:20px;cursor:pointer;}
.expr-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .45s;}
.expr-card.flipped{transform:rotateY(180deg);}
.expr-face{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  background:rgba(255,248,252,0.9);border:1px solid rgba(212,84,138,0.18);
  border-radius:14px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;text-align:center;gap:10px;
}
.expr-back{transform:rotateY(180deg);}
.expr-en{font-size:26px;font-weight:700;color:#8b5cf6;line-height:1.5;}
.expr-ko{font-size:22px;font-weight:600;color:#2d1523;line-height:1.5;}
.expr-tag{font-size:11px;color:#b07888;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{
  background:rgba(255,248,252,0.9);border:1px solid rgba(212,84,138,0.15);
  border-radius:12px;padding:18px;text-align:center;
}
.stat-val{font-size:32px;font-weight:900;color:#c2185b;}
.stat-lbl{font-size:12px;color:#9a6878;margin-top:4px;}
.srs-bars{margin-bottom:24px;}
.srs-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.srs-bar-lbl{font-size:13px;color:#9a6878;width:50px;flex-shrink:0;}
.srs-bar-bg{flex:1;height:10px;background:rgba(194,24,91,0.1);border-radius:5px;overflow:hidden;}
.srs-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#f06292,#ba68c8);transition:width .4s;}
.srs-bar-count{font-size:12px;color:#9a6878;width:40px;text-align:right;}
.reset-btn{
  padding:10px 20px;background:rgba(220,80,80,0.1);color:#c0392b;
  border:1px solid rgba(220,80,80,0.25);border-radius:8px;font-size:13px;
  cursor:pointer;font-family:inherit;
}
.reset-btn:hover{background:rgba(220,80,80,0.2);}
.section-title{font-size:16px;font-weight:700;color:#4a2a3a;margin-bottom:12px;}

@media(max-width:600px){
  #nav{padding:0 10px;}
  .logo{font-size:18px;margin-right:8px;}
  .nav-btn{padding:0 10px;font-size:13px;}
  .card-face{padding:20px 18px;}
  .card-face .ko{font-size:22px;}
  .card-face .en{font-size:18px;}
  .dial-card{padding:16px 14px;}
}
</style>
</head>
<body>

<!-- ── PASSWORD SCREEN ── -->
<div id="pw-screen">
  <div class="pw-logo">PSE LADDER</div>
  <div class="pw-sub">Steve's Class 복습 시스템</div>
  <div id="pw-box">
    <input id="pw-input" type="password" placeholder="Password"
      onkeydown="if(event.key==='Enter')checkPw()" autofocus />
    <button id="pw-submit" onclick="checkPw()">입장</button>
    <div id="pw-error"></div>
  </div>
</div>

<!-- ── NAV ── -->
<nav id="nav">
  <div class="logo">PSE</div>
  <button class="nav-btn active" onclick="showTab('fc')">플래시카드</button>
  <button class="nav-btn" onclick="showTab('dial')">대화문</button>
  <button class="nav-btn" onclick="showTab('expr')">표현</button>
  <button class="nav-btn" onclick="showTab('stats')">학습 현황</button>
  <div id="timer-wrap">오늘 <span id="timer">0:00</span></div>
</nav>

<!-- ── MAIN ── -->
<div id="main">

  <!-- FLASHCARD TAB -->
  <div id="tab-fc" class="view active">
    <div class="filters" id="fc-bm-filters">
      <button class="filter-btn active" onclick="setFcBm('all')">전체</button>
      <button class="filter-btn" onclick="setFcBm('BM1')">BM1</button>
      <button class="filter-btn" onclick="setFcBm('BM2')">BM2</button>
      <button class="filter-btn" onclick="setFcBm('BM3')">BM3</button>
      <div class="filter-sep"></div>
      <select class="filter-select" id="fc-day-select" onchange="setFcDay(this.value)">
        <option value="all">전체 Day</option>
      </select>
    </div>
    <div class="mode-select-row">
      <button class="mode-btn active" onclick="setFcMode('srs')">약점 집중 SRS</button>
      <button class="mode-btn" onclick="setFcMode('random')">전체 랜덤</button>
      <button class="mode-btn" onclick="setFcMode('new')">새 문장만</button>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="fc-progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="fc-progress-text">0 / 0</div>
    </div>
    <div class="card-hint" id="fc-hint">시작 버튼을 누르세요</div>
    <div class="card-wrap" id="fc-card-wrap" onclick="flipFcCard()" style="display:none">
      <div class="card" id="fc-card">
        <div class="card-face card-front">
          <div class="lbl">한국어</div>
          <div class="ko" id="fc-ko"></div>
          <div class="day-tag" id="fc-day-tag"></div>
        </div>
        <div class="card-face card-back">
          <div class="lbl">영어</div>
          <div class="en" id="fc-en"></div>
        </div>
      </div>
    </div>
    <div id="fc-start-area" style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-primary" onclick="startFcSession()">▶ 시작</button>
    </div>
    <div class="card-actions" id="fc-actions" style="display:none">
      <button class="btn btn-dontknow" onclick="markFc(false)">모름 ←</button>
      <button class="btn btn-skip" onclick="skipFc()">건너뜀</button>
      <button class="btn btn-know" onclick="markFc(true)">알아요 →</button>
    </div>
    <div id="fc-done" class="done-card" style="display:none">
      <h2>🎉 세션 완료!</h2>
      <p id="fc-done-msg"></p>
      <button class="btn btn-primary" onclick="startFcSession()">다시 하기</button>
    </div>
  </div>

  <!-- DIALOGUE TAB -->
  <div id="tab-dial" class="view">
    <div class="filters" id="dial-bm-filters">
      <button class="filter-btn active" onclick="setDialBm('all')">전체</button>
      <button class="filter-btn" onclick="setDialBm('BM1')">BM1</button>
      <button class="filter-btn" onclick="setDialBm('BM2')">BM2</button>
      <button class="filter-btn" onclick="setDialBm('BM3')">BM3</button>
      <div class="filter-sep"></div>
      <select class="filter-select" id="dial-day-select" onchange="setDialDay(this.value)">
        <option value="all">전체 Day</option>
      </select>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="dial-progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="dial-progress-text">0 / 0</div>
    </div>
    <div id="dial-content">
      <div class="empty-state">표시할 대화문이 없습니다.<br>필터를 조정하세요.</div>
    </div>
    <div class="dial-nav" id="dial-nav" style="display:none">
      <button class="btn btn-skip" onclick="dialPrev()">← 이전</button>
      <span class="dial-nav-info" id="dial-nav-info"></span>
      <button class="btn btn-primary" onclick="dialNext()">다음 →</button>
    </div>
  </div>

  <!-- EXPRESSION TAB -->
  <div id="tab-expr" class="view">
    <div class="filters" id="expr-bm-filters">
      <button class="filter-btn active" onclick="setExprBm('all')">전체</button>
      <button class="filter-btn" onclick="setExprBm('BM1')">BM1</button>
      <button class="filter-btn" onclick="setExprBm('BM2')">BM2</button>
      <button class="filter-btn" onclick="setExprBm('BM3')">BM3</button>
      <div class="filter-sep"></div>
      <select class="filter-select" id="expr-day-select" onchange="setExprDay(this.value)">
        <option value="all">전체 Day</option>
      </select>
    </div>
    <div class="mode-select-row">
      <button class="mode-btn active" onclick="setExprMode('srs')">SRS</button>
      <button class="mode-btn" onclick="setExprMode('random')">전체 랜덤</button>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><div class="progress-fill" id="expr-progress-fill" style="width:0%"></div></div>
      <div class="progress-text" id="expr-progress-text">0 / 0</div>
    </div>
    <div class="card-hint" id="expr-hint">시작 버튼을 누르세요</div>
    <div class="expr-card-wrap" id="expr-card-wrap" onclick="flipExprCard()" style="display:none">
      <div class="expr-card" id="expr-card">
        <div class="expr-face expr-front">
          <div class="lbl">영어 표현</div>
          <div class="expr-en" id="expr-en"></div>
          <div class="expr-tag" id="expr-day-tag"></div>
        </div>
        <div class="expr-face expr-back">
          <div class="lbl">한국어 뜻</div>
          <div class="expr-ko" id="expr-ko"></div>
        </div>
      </div>
    </div>
    <div id="expr-start-area" style="text-align:center;margin-bottom:20px;">
      <button class="btn btn-primary" onclick="startExprSession()">▶ 시작</button>
    </div>
    <div class="card-actions" id="expr-actions" style="display:none">
      <button class="btn btn-dontknow" onclick="markExpr(false)">모름 ←</button>
      <button class="btn btn-skip" onclick="skipExpr()">건너뜀</button>
      <button class="btn btn-know" onclick="markExpr(true)">알아요 →</button>
    </div>
    <div id="expr-done" class="done-card" style="display:none">
      <h2>완료!</h2>
      <p id="expr-done-msg"></p>
      <button class="btn btn-primary" onclick="startExprSession()">다시 하기</button>
    </div>
  </div>

  <!-- STATS TAB -->
  <div id="tab-stats" class="view">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-title">문장 SRS 박스 분포</div>
    <div class="srs-bars" id="srs-bars-sent"></div>
    <div class="section-title" style="margin-top:20px">표현 SRS 박스 분포</div>
    <div class="srs-bars" id="srs-bars-expr"></div>
    <div style="margin-top:24px">
      <button class="reset-btn" onclick="resetAll()">⚠ 전체 초기화</button>
    </div>
  </div>

</div>

We need to get the students to always speak (in) English.", "bm": "BM1", "day": "Day13"}, {"ko": "우리 부모님께선 내가 머리를 짧게 자르게 하려고 하고 있어.", "en": "My parents are trying to get me to get my hair cut short.", "bm": "BM1", "day": "Day13"}, {"ko": "난 내 친구들이 PSE에서 영어공부를 하게 하려고 하고 있어.", "en": "I’m trying to get my friends to study English at PSE.", "bm": "BM1", "day": "Day13"}, {"ko": "내가 널 얼마나 많이 사랑하는지 알아줬으면 좋겠어.", "en": "I want you to know how much I love you.", "bm": "BM1", "day": "Day13"}, {"ko": "내가 오늘 네 병문안 갈까?", "en": "Do you want me to visit you in the hospital today?", "bm": "BM1", "day": "Day13"}, {"ko": "우리 부모님이 나한테 집에 지금 당장 오라고 하셔.", "en": "My parents want me to come home right now.", "bm": "BM1", "day": "Day13"}, {"ko": "내가 너 내일 언제 데리러 갈까?", "en": "When do you want me to pick you up tomorrow?", "bm": "BM1", "day": "Day13"}, {"ko": "최대한 빨리 나한테 전화해 줘.", "en": "I want you to call me ASAP.", "bm": "BM1", "day": "Day13"}, {"ko": "제가 도와드릴까요?", "en": "Would you like me to help you?", "bm": "BM1", "day": "Day13"}, {"ko": "제 여자친구 Liz 에요.", "en": "I’d like you to meet my girlfriend Liz.", "bm": "BM1", "day": "Day13"}, {"ko": "내 트레이너가 나보고 탄수화물을 줄이면 좋겠대.", "en": "My personal trainer would like me to cut down on carbs.", "bm": "BM1", "day": "Day13"}, {"ko": "제가 같이 가드릴까요?", "en": "Would you like me to keep you company?", "bm": "BM1", "day": "Day13"}, {"ko": "내가 너한테 늦지 말라고 몇 번이나 말했어?", "en": "How many times have I told you not to be late?", "bm": "BM1", "day": "Day13"}, {"ko": "걔네들한테 소리 좀 낮추라고 해줄 수 있어?", "en": "Can you tell them to keep it down?", "bm": "BM1", "day": "Day13"}, {"ko": "걔네들한테 여기에 몇 시까지 오라고 했어?", "en": "What time did you tell them to get here by?", "bm": "BM1", "day": "Day13"}, {"ko": "나한테 뭐 하라고 했어?", "en": "What did you tell me to do?", "bm": "BM1", "day": "Day13"}, {"ko": "너 진짜 네 여자친구에게 너랑 결혼해 달라고 할 거야?", "en": "Are you really going to ask your girlfriend to marry you?", "bm": "BM1", "day": "Day13"}, {"ko": "내 예전 애인이 나한테 자기를(남자) 용서해달라고 부탁했어.", "en": "My ex asked me to forgive him.", "bm": "BM1", "day": "Day13"}, {"ko": "(3)우리 사진 찍어달라고 남자한테 부탁해 줄 수 있어?", "en": "Can you ask him to take a picture of us?", "bm": "BM1", "day": "Day13"}, {"ko": "걔(남자)가 우리한테 자길 어디에서 기다려 달라고 했어?", "en": "Where did he ask us to wait for him?", "bm": "BM1", "day": "Day13"}, {"ko": "네가 걔한테 너랑 같이 저녁 먹자고 부탁하는 게 좋겠다.", "en": "You should ask her to have dinner with you.", "bm": "BM1", "day": "Day13"}, {"ko": "넌 내 말을 주의 깊게 들어 줘야 돼.", "en": "I need you to listen to me carefully.", "bm": "BM1", "day": "Day13"}, {"ko": "소포를 받으시려면, 여기에 먼저 사인을 해주셔야 합니다.", "en": "If you want the package, I need you to sign here first.", "bm": "BM1", "day": "Day13"}, {"ko": "저, 이번 주말에 일해야 하나요?", "en": "Do you need me to work this weekend?", "bm": "BM1", "day": "Day13"}, {"ko": "네가 일단 좀 흥분을 가라앉힐 필요가 있어.", "en": "I need you to calm down first.", "bm": "BM1", "day": "Day13"}, {"ko": "나한테 사실대로 말해줘야 돼.", "en": "I need you to tell me the truth.", "bm": "BM1", "day": "Day13"}, {"ko": "왜 내가 항상 너한테 네 숙제를 하라고 다시 알려줘야 돼?", "en": "Why do I always have to remind you to do your homework?", "bm": "BM1", "day": "Day14"}, {"ko": "걔네들한테 가기 전에 불 끄라고 말해줄 수 있어?", "en": "Can you remind them to turn off the lights before they leave?", "bm": "BM1", "day": "Day14"}, {"ko": "엄마한테 빨래하라고 다시 알려줘.", "en": "Remind mom to do the laundry.", "bm": "BM1", "day": "Day14"}, {"ko": "나한테 돈을 좀 인출해야 하는 걸 다시 말해주는 거 잊지 마.", "en": "Don’t forget to remind me to take out some money.", "bm": "BM1", "day": "Day14"}, {"ko": "내가 너 이 게임 어떻게 하는 지 가르쳐줄까?", "en": "Do you want me to teach you (how) to play this game?", "bm": "BM1", "day": "Day14"}, {"ko": "저한테 제대로 R을 발음하는 법을 가르쳐주실 수 있나요?", "en": "Can you teach me (how) to pronounce the “R” properly?", "bm": "BM1", "day": "Day14"}, {"ko": "가르쳐 주시지 않았니?", "en": "Didn't your parents teach you to treat elders with respect?", "bm": "BM1", "day": "Day14"}, {"ko": "내가 걔(남자)한테 나랑 같이 한 편 보자고 설득했어.", "en": "but I convinced him to watch one with me.", "bm": "BM1", "day": "Day14"}, {"ko": "난 우리 부 ed on driving me home.", "bm": "BM1", "day": "Day15"}, {"ko": "내 친구들은 나보고 꼭 PSE에서 영어 공부하라고 했어.", "en": "My friends insisted that I study English at PSE.", "bm": "BM1", "day": "Day15"}, {"ko": "모든 학생들은 항상 자신의 스트랩을 착용해야 돼.", "en": "It requires that all (of) the students wear their strap at all times.", "bm": "BM1", "day": "Day15"}, {"ko": "PSE 프로그램에 따르면 모든 수업을 들어야 하고", "en": "The PSE program requires that you take all (of) the classes", "bm": "BM1", "day": "Day15"}, {"ko": "멘토와 PT도 되어야 해.", "en": "and become a mentor and a PT.", "bm": "BM1", "day": "Day15"}, {"ko": "법에 따르면 모든 운전자들은 안전벨트를 착용해야 합니다.", "en": "The law requires that all drivers wear their seatbelt.", "bm": "BM1", "day": "Day15"}, {"ko": "Dale 선생님께서 모두에게 오라고 정중하게 부탁하셔.", "en": "Dale requests that everyone come.", "bm": "BM1", "day": "Day15"}, {"ko": "정중히 부탁했어.", "en": "but my manager requested that I come to work today.", "bm": "BM1", "day": "Day15"}, {"ko": "정중하게 부탁해.", "en": "They request that people keep quiet during the movie.", "bm": "BM1", "day": "Day15"}, {"ko": "걔네들은 모두한테 파티에 자기 맥주를 가져와 달라고 부탁했어.", "en": "They asked that everyone bring their own beer to the party.", "bm": "BM1", "day": "Day15"}, {"ko": "(2)걔네들이 우리의 5일 여행을 위해 우리한테 뭘 챙겨와 달라고 했어?", "en": "What did they ask that we pack for our 5-day trip?", "bm": "BM1", "day": "Day15"}, {"ko": "SC들은 학생들께 스터디 하는 동안에는 휴대폰을 사용하지", "en": "The SCs asked that the students not use their cellphone", "bm": "BM1", "day": "Day15"}, {"ko": "무슨 일이 있었는지 우리한테 반드시 말해!", "en": "We demand that you tell us what happened!", "bm": "BM1", "day": "Day15"}, {"ko": "(2)걔(여자)는 나한테 반드시 당장 사과하라고 했어.", "en": "She demanded that I apologize immediately.", "bm": "BM1", "day": "Day15"}, {"ko": "우리 부모님은 나한테 반드시 자정 전에 집에 오라고 하셔.", "en": "My parents demand that I come home before midnight.", "bm": "BM1", "day": "Day15"}, {"ko": "네가 웃고 있는 게 들렸어.", "en": "I heard you laughing.", "bm": "BM1", "day": "Day16"}, {"ko": "네가 숨 쉬는 게 느껴져.", "en": "I can feel you breathing on me.", "bm": "BM1", "da const LS_KEY = 'pse_ladder_v1';
let state = {
  sent_boxes: {}, // idx → 1-4
  expr_boxes: {},
  study_secs: 0,
  last_date: '',
  test_history: []
};

function loadState(){
  try {
    const s = localStorage.getItem(LS_KEY);
    if(s) state = Object.assign(state, JSON.parse(s));
  } catch(e){}
  // Reset timer if new day
  const today = new Date().toISOString().slice(0,10);
  if(state.last_date !== today){
    state.study_secs = 0;
    state.last_date = today;
    saveState();
  }
}
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}
function resetAll(){
  if(!confirm('모든 학습 데이터를 초기화할까요?')) return;
  state = {sent_boxes:{},expr_boxes:{},study_secs:0,last_date:'',test_history:[]};
  saveState();
  updateStats();
  startFcSession();
  startExprSession();
}

// ── TIMER ──
let timerInterval = null;
function startTimer(){
  if(timerInterval) return;
  timerInterval = setInterval(()=>{
    state.study_secs++;
    saveState();
    const m = Math.floor(state.study_secs/60);
    const s = state.study_secs % 60;
    document.getElementById('timer').textContent = m + ':' + String(s).padStart(2,'0');
  }, 1000);
}

// ── TABS ──
let currentTab = 'fc';
function showTab(tab){
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active', ['fc','dial','expr','stats'][i] === tab);
  });
  if(tab==='stats') updateStats();
}

// ── FILTER HELPERS ──
function getBmDays(arr, bm, day){
  return arr.filter(x=>{
    const bmOk = bm==='all' || x.bm===bm;
    const dayOk = day==='all' || x.day===day;
    return bmOk && dayOk;
  });
}

function populateDaySelect(selectId, arr, bm){
  const sel = document.getElementById(selectId);
  const cur = sel.value;
  while(sel.options.length > 1) sel.remove(1);
  const days = new Set(arr.filter(x=>bm==='all'||x.bm===bm).map(x=>x.day));
  const sorted = [...days].sort((a,b)=>{
    const [abm,ad] = [a.slice(0,3),parseInt(a.slice(3))];
    const [bbm,bd] = [b.slice(0,3),parseInt(b.slice(3))];
    return abm.localeCompare(bbm)||ad-bd;
  });
  sorted.forEach(d=>{
    const opt = document.createElement('option');
    opt.value = d; opt.textContent = d;
    sel.appendChild(opt);
  });
  if([...days].includes(cur)) sel.value = cur;
}

// ── FLASHCARD ──
let fcBm = 'all', fcDay = 'all', fcMode = 'srs';
let fcQueue = [], fcIdx = 0, fcFlipped = false;
let fcKnown = 0, fcUnknown = 0;

function setFcBm(bm){
  fcBm = bm;
  document.querySelectorAll('#fc-bm-filters .filter-btn').forEach((b,i)=>
    b.classList.toggle('active', ['all','BM1','BM2','BM3'][i]===bm));
  populateDaySelect('fc-day-select', SENTENCES, bm);
  fcDay = 'all';
  document.getElementById('fc-day-select').value = 'all';
}
function setFcDay(d){ fcDay=d; }
function setFcMode(m){
  fcMode=m;
  document.querySelectorAll('.mode-select-row .mode-btn').forEach((b,i)=>
    b.classList.toggle('active',['srs','random','new'][i]===m));
}

function buildFcQueue(){
  let pool = getBmDays(SENTENCES, fcBm, fcDay);
  if(fcMode === 'srs'){
    // SRS: box1 every session, box2 every 2 sessions, box3 every 5, box4 exclude
    pool = pool.filter((s,i)=>{
      const box = state.sent_boxes[i] || 1;
      if(box >= 4) return false;
      return true;
    });
    pool = shuffleArr(pool.slice()).slice(0, 60);
  } else if(fcMode === 'random'){
    pool = shuffleArr(pool.slice()).slice(0, 50);
  } else if(fcMode === 'new'){
    const allIdx = new Map(SENTENCES.map((s,i)=>[s.en, i]));
    pool = pool.filter(s=>{
      const idx = allIdx.get(s.en);
      return !state.sent_boxes[idx] || state.sent_boxes[idx] === 1;
    });
    pool = shuffleArr(pool.slice()).slice(0, 40);
  }
  return pool.map(s=>{
    const idx = SENTENCES.findIndex(x=>x.en===s.en);
    return {...s, idx};
  });
}

function startFcSession(){
  fcQueue = buildFcQueue();
  fcIdx = 0; fcFlipped = false; fcKnown = 0; fcUnknown = 0;
  document.getElementById('fc-done').style.display = 'none';
  document.getElementById('fc-start-area').style.display = 'none';
  if(fcQueue.length === 0){
    document.getElementById('fc-hint').textContent = '해당 조건의 문장이 없습니다.';
    document.getElementById('fc-hint').style.color = '#c0392b';
    document.getElementById('fc-card-wrap').style.display = 'none';
    document.getElementById('fc-actions').style.display = 'none';
    return;
  }
  document.getElementById('fc-hint').style.color = '';
  showFcCard();
}

function showFcCard(){
  if(fcIdx >= fcQueue.length){
    showFcDone(); return;
  }
  const s = fcQueue[fcIdx];
  document.getElementById('fc-card').classList.remove('flipped');
  fcFlipped = false;
  document.getElementById('fc-ko').textContent = s.ko;
  document.getElementById('fc-en').textContent = s.en;
  document.getElementById('fc-day-tag').textContent = s.bm + ' ' + s.day;
  document.getElementById('fc-hint').textContent = '탭하거나 Space를 눌러 뒤집기';
  document.getElementById('fc-card-wrap').style.display = 'block';
  document.getElementById('fc-actions').style.display = 'none';
  updateFcProgress();
}

function flipFcCard(){
  if(!fcFlipped){
    document.getElementById('fc-card').classList.add('flipped');
    fcFlipped = true;
    document.getElementById('fc-actions').style.display = 'flex';
    document.getElementById('fc-hint').textContent = '다시 누르면 한국어로';
  } else {
    document.getElementById('fc-card').classList.remove('flipped');
    fcFlipped = false;
    document.getElementById('fc-actions').style.display = 'none';
    document.getElementById('fc-hint').textContent = '탭하거나 Space를 눌러 뒤집기';
  }
}

function markFc(knew){
  const s = fcQueue[fcIdx];
  const box = state.sent_boxes[s.idx] || 1;
  if(knew){
    state.sent_boxes[s.idx] = Math.min(4, box + 1);
    fcKnown++;
  } else {
    state.sent_boxes[s.idx] = 1;
    fcUnknown++;
  }
  saveState();
  fcIdx++;
  showFcCard();
}

function skipFc(){ fcIdx++; showFcCard(); }

function updateFcProgress(){
  const pct = fcQueue.length ? (fcIdx / fcQueue.length * 100) : 0;
  document.getElementById('fc-progress-fill').style.width = pct + '%';
  document.getElementById('fc-progress-text').textContent = fcIdx + ' / ' + fcQueue.length;
}

function showFcDone(){
  document.getElementById('fc-card-wrap').style.display = 'none';
  document.getElementById('fc-actions').style.display = 'none';
  document.getElementById('fc-hint').textContent = '';
  document.getElementById('fc-done').style.display = 'block';
  document.getElementById('fc-done-msg').textContent =
    `알아요: ${fcKnown}  모름: ${fcUnknown}  총 ${fcQueue.length}개 완료!`;
}

// ── DIALOGUE ──
let dialBm = 'all', dialDay = 'all';
let dialQueue = [], dialIdx = 0;

function setDialBm(bm){
  dialBm = bm;
  document.querySelectorAll('#dial-bm-filters .filter-btn').forEach((b,i)=>
    b.classList.toggle('active', ['all','BM1','BM2','BM3'][i]===bm));
  populateDaySelect('dial-day-select', DIALOGUES, bm);
  dialDay = 'all';
  document.getElementById('dial-day-select').value = 'all';
  renderDialogue();
}
function setDialDay(d){ dialDay=d; renderDialogue(); }

function renderDialogue(){
  dialQueue = getBmDays(DIALOGUES, dialBm, dialDay);
  dialIdx = 0;
  if(dialQueue.length === 0){
    document.getElementById('dial-content').innerHTML =
      '<div class="empty-state">표시할 대화문이 없습니다.<br>필터를 조정하거나 다른 BM을 선택하세요.</div>';
    document.getElementById('dial-nav').style.display = 'none';
    document.getElementById('dial-progress-fill').style.width = '0%';
    document.getElementById('dial-progress-text').textContent = '0 / 0';
    return;
  }
  document.getElementById('dial-nav').style.display = 'flex';
  showDialCard();
}

function showDialCard(){
  if(dialQueue.length === 0) return;
  const d = dialQueue[dialIdx];
  const lines = d.lines || [];

  let html = `<div class="dial-card">`;
  html += `<div style="font-size:12px;color:#b07888;margin-bottom:12px;">${d.bm} ${d.day} · 대화문 ${dialIdx+1}/${dialQueue.length}</div>`;

  lines.forEach((l, li) => {
    const spk = l.speaker === 'A' ? 'A' : 'B';
    const ko = l.ko || '';
    const en = l.en || '';
    const isTarget = l.target;

    html += `<div class="dial-line">`;
    html += `<div class="dial-spk">${spk}</div>`;
    html += `<div class="dial-content">`;
    if(ko) html += `<div class="dial-ko">${escHtml(ko)}</div>`;

    if(en){
      if(isTarget){
        html += `<div class="dial-en hidden" data-en="${escAttr(en)}" onclick="revealDialEn(this)">&nbsp;</div>`;
      } else {
        html += `<div class="dial-en context">${escHtml(en)}</div>`;
      }
    }
    html += `</div></div>`;
  });

  html += `<div style="margin-top:14px;display:flex;gap:10px;justify-content:center;">`;
  html += `<button class="dial-reveal-btn" onclick="revealAllDial()">전체 공개</button>`;
  html += `</div>`;
  html += `</div>`;

  document.getElementById('dial-content').innerHTML = html;

  const pct = dialQueue.length ? ((dialIdx+1) / dialQueue.length * 100) : 0;
  document.getElementById('dial-progress-fill').style.width = pct + '%';
  document.getElementById('dial-progress-text').textContent = (dialIdx+1) + ' / ' + dialQueue.length;
  document.getElementById('dial-nav-info').textContent = `${dialIdx+1} / ${dialQueue.length}`;
}

function revealDialEn(el){
  const en = el.getAttribute('data-en');
  el.textContent = en;
  el.classList.remove('hidden');
  el.classList.add('revealed');
}
function revealAllDial(){
  document.querySelectorAll('.dial-en.hidden').forEach(revealDialEn);
}
function dialPrev(){ if(dialIdx>0){dialIdx--;showDialCard();} }
function dialNext(){ if(dialIdx<dialQueue.length-1){dialIdx++;showDialCard();}
  else { dialIdx=0; showDialCard(); } }

// ── EXPRESSIONS ──
let exprBm = 'all', exprDay = 'all', exprMode = 'srs';
let exprQueue = [], exprIdx = 0, exprFlipped = false;
let exprKnown = 0, exprUnknown = 0;

function setExprBm(bm){
  exprBm = bm;
  document.querySelectorAll('#expr-bm-filters .filter-btn').forEach((b,i)=>
    b.classList.toggle('active', ['all','BM1','BM2','BM3'][i]===bm));
  populateDaySelect('expr-day-select', EXPRESSIONS, bm);
  exprDay = 'all';
  document.getElementById('expr-day-select').value = 'all';
}
function setExprDay(d){ exprDay=d; }
function setExprMode(m){
  exprMode=m;
  document.querySelectorAll('#tab-expr .mode-btn').forEach((b,i)=>
    b.classList.toggle('active',['srs','random'][i]===m));
}

function buildExprQueue(){
  let pool = getBmDays(EXPRESSIONS, exprBm, exprDay);
  if(exprMode === 'srs'){
    pool = pool.filter((e,i)=>{
      const box = state.expr_boxes[i] || 1;
      return box < 4;
    });
    pool = shuffleArr(pool.slice()).slice(0,40);
  } else {
    pool = shuffleArr(pool.slice()).slice(0,40);
  }
  return pool.map(e=>{
    const idx = EXPRESSIONS.findIndex(x=>x.en===e.en&&x.ko===e.ko);
    return {...e, idx};
  });
}

function startExprSession(){
  exprQueue = buildExprQueue();
  exprIdx = 0; exprFlipped = false; exprKnown = 0; exprUnknown = 0;
  document.getElementById('expr-done').style.display = 'none';
  document.getElementById('expr-start-area').style.display = 'none';
  if(exprQueue.length === 0){
    document.getElementById('expr-hint').textContent = '표현이 없습니다.';
    document.getElementById('expr-card-wrap').style.display = 'none';
    document.getElementById('expr-actions').style.display = 'none';
    return;
  }
  showExprCard();
}

function showExprCard(){
  if(exprIdx >= exprQueue.length){ showExprDone(); return; }
  const e = exprQueue[exprIdx];
  document.getElementById('expr-card').classList.remove('flipped');
  exprFlipped = false;
  document.getElementById('expr-en').textContent = e.en;
  document.getElementById('expr-ko').textContent = e.ko;
  document.getElementById('expr-day-tag').textContent = e.bm + ' ' + e.day;
  document.getElementById('expr-hint').textContent = '탭하거나 Space를 눌러 뒤집기';
  document.getElementById('expr-card-wrap').style.display = 'block';
  document.getElementById('expr-actions').style.display = 'none';
  updateExprProgress();
}

function flipExprCard(){
  if(!exprFlipped){
    document.getElementById('expr-card').classList.add('flipped');
    exprFlipped = true;
    document.getElementById('expr-actions').style.display = 'flex';
    document.getElementById('expr-hint').textContent = '다시 누르면 한국어로';
  } else {
    document.getElementById('expr-card').classList.remove('flipped');
    exprFlipped = false;
    document.getElementById('expr-actions').style.display = 'none';
    document.getElementById('expr-hint').textContent = '탭하거나 Space를 눌러 뒤집기';
  }
}

function markExpr(knew){
  const e = exprQueue[exprIdx];
  const box = state.expr_boxes[e.idx] || 1;
  if(knew){ state.expr_boxes[e.idx] = Math.min(4, box+1); exprKnown++; }
  else { state.expr_boxes[e.idx] = 1; exprUnknown++; }
  saveState();
  exprIdx++;
  showExprCard();
}
function skipExpr(){ exprIdx++; showExprCard(); }

function updateExprProgress(){
  const pct = exprQueue.length ? (exprIdx/exprQueue.length*100) : 0;
  document.getElementById('expr-progress-fill').style.width = pct+'%';
  document.getElementById('expr-progress-text').textContent = exprIdx+' / '+exprQueue.length;
}

function showExprDone(){
  document.getElementById('expr-card-wrap').style.display = 'none';
  document.getElementById('expr-actions').style.display = 'none';
  document.getElementById('expr-hint').textContent = '';
  document.getElementById('expr-done').style.display = 'block';
  document.getElementById('expr-done-msg').textContent =
    `알아요: ${exprKnown}  모름: ${exprUnknown}  총 ${exprQueue.length}개 완료!`;
}

// ── STATS ──
function updateStats(){
  // Count boxes
  const sentBoxes = [0,0,0,0,0]; // idx 0 unused, 1-4
  SENTENCES.forEach((s,i)=>{
    const b = state.sent_boxes[i]||1;
    sentBoxes[Math.min(b,4)]++;
  });
  const exprBoxes = [0,0,0,0,0];
  EXPRESSIONS.forEach((e,i)=>{
    const b = state.expr_boxes[i]||1;
    exprBoxes[Math.min(b,4)]++;
  });

  const learned = sentBoxes[4];
  const exprLearned = exprBoxes[4];
  const totalMin = Math.floor(state.study_secs/60);

  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-val">${SENTENCES.length}</div><div class="stat-lbl">총 문장</div></div>
    <div class="stat-card"><div class="stat-val">${EXPRESSIONS.length}</div><div class="stat-lbl">총 표현</div></div>
    <div class="stat-card"><div class="stat-val">${DIALOGUES.length}</div><div class="stat-lbl">대화문</div></div>
    <div class="stat-card"><div class="stat-val">${learned}</div><div class="stat-lbl">완료 문장</div></div>
    <div class="stat-card"><div class="stat-val">${exprLearned}</div><div class="stat-lbl">완료 표현</div></div>
    <div class="stat-card"><div class="stat-val">${totalMin}</div><div class="stat-lbl">총 공부 시간(분)</div></div>
  `;

  const labels = ['미시작','박스1','박스2','박스3','완료'];
  const colors = ['#ccc','#f06292','#ba68c8','#7986cb','#66bb6a'];

  function renderBars(containerId, boxes){
    let html = '';
    for(let b=1;b<=4;b++){
      const count = boxes[b];
      const pct = SENTENCES.length ? (count/SENTENCES.length*100).toFixed(1) : 0;
      html += `<div class="srs-bar-row">
        <div class="srs-bar-lbl">${labels[b]}</div>
        <div class="srs-bar-bg"><div class="srs-bar-fill" style="width:${pct}%;background:${colors[b]}"></div></div>
        <div class="srs-bar-count">${count}</div>
      </div>`;
    }
    document.getElementById(containerId).innerHTML = html;
  }
  renderBars('srs-bars-sent', sentBoxes);

  const eLabels = ['미시작','박스1','박스2','박스3','완료'];
  let eHtml = '';
  for(let b=1;b<=4;b++){
    const count = exprBoxes[b];
    const pct = EXPRESSIONS.length ? (count/EXPRESSIONS.length*100).toFixed(1) : 0;
    eHtml += `<div class="srs-bar-row">
      <div class="srs-bar-lbl">${eLabels[b]}</div>
      <div class="srs-bar-bg"><div class="srs-bar-fill" style="width:${pct}%;background:${colors[b]}"></div></div>
      <div class="srs-bar-count">${count}</div>
    </div>`;
  }
  document.getElementById('srs-bars-expr').innerHTML = eHtml;
}

// ── UTILS ──
function shuffleArr(arr){
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s){ return escHtml(s); }

// ── KEYBOARD ──
document.addEventListener('keydown', e=>{
  if(document.getElementById('pw-screen').style.display !== 'none') return;
  if(currentTab === 'fc'){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipFcCard(); }
    if(e.key==='ArrowLeft'||e.key==='1') markFc(false);
    if(e.key==='ArrowRight'||e.key==='2'||e.key==='ArrowUp') markFc(true);
    if(e.key==='ArrowDown') skipFc();
  }
  if(currentTab === 'expr'){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); flipExprCard(); }
    if(e.key==='ArrowLeft'||e.key==='1') markExpr(false);
    if(e.key==='ArrowRight'||e.key==='2') markExpr(true);
    if(e.key==='ArrowDown') skipExpr();
  }
  if(currentTab === 'dial'){
    if(e.key==='ArrowLeft') dialPrev();
    if(e.key==='ArrowRight') dialNext();
    if(e.key==='r'||e.key==='R') revealAllDial();
  }
});

// ── SERVICE WORKER ──
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// ── INIT ──
function initApp(){
  loadState();
  startTimer();
  // Populate day selects
  populateDaySelect('fc-day-select', SENTENCES, 'all');
  populateDaySelect('dial-day-select', DIALOGUES, 'all');
  populateDaySelect('expr-day-select', EXPRESSIONS, 'all');
  renderDialogue();
  updateStats();
}
</script>
